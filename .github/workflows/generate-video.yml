name: Generate educational video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема нового видео"
        required: true
        type: string
      duration:
        description: "Минимальная целевая длительность (минуты)"
        required: true
        type: choice
        options:
          - "10"
          - "12"
          - "15"
        default: "10"
      tone:
        description: "Стиль подачи"
        required: true
        type: choice
        options:
          - informative
          - educational
          - curious
        default: informative
      notes:
        description: "Дополнительные пожелания (необязательно)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUSSIAN_TTS_STUDIO_URL: ${{ secrets.RUSSIAN_TTS_STUDIO_URL }}
      RUSSIAN_TTS_ENGINE: voxcpm
      RUSSIAN_TTS_TIMEOUT: "600"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src batch_generate.py

      - name: Check required API secrets
        run: |
          python - <<'PY'
          import os, sys
          missing = [name for name in ("OPENAI_API_KEY", "RUSSIAN_TTS_STUDIO_URL") if not os.getenv(name)]
          if missing:
              print("Missing required GitHub Actions secret: " + ", ".join(missing))
              print("Add them in Settings > Secrets and variables > Actions.")
              print("RUSSIAN_TTS_STUDIO_URL must be the public HTTPS base URL of your running Russian TTS Studio server.")
              sys.exit(1)
          print("Required API secrets are present.")
          PY

      - name: Prepare one-video queue
        env:
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_DURATION: ${{ inputs.duration }}
          VIDEO_TONE: ${{ inputs.tone }}
          VIDEO_NOTES: ${{ inputs.notes }}
        run: |
          python - <<'PY'
          import csv, os
          fields = [
              "topic", "target_duration_minutes", "status", "priority", "tone", "style",
              "notes", "actual_duration_minutes", "word_count", "output_path", "completed_at", "error_message"
          ]
          topic = os.environ["VIDEO_TOPIC"].strip()
          if not topic:
              raise SystemExit("Video topic cannot be empty.")
          with open("topics.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerow({
                  "topic": topic,
                  "target_duration_minutes": float(os.environ["VIDEO_DURATION"]),
                  "status": "pending",
                  "priority": 1,
                  "tone": os.environ["VIDEO_TONE"],
                  "style": "educational",
                  "notes": os.environ.get("VIDEO_NOTES", "").strip(),
              })
          print(f"Queued one Russian-language video: {topic}")
          PY

      - name: Generate video
        run: python batch_generate.py --all --language ru

      - name: Verify generated MP4 quality
        if: always()
        env:
          VIDEO_DURATION: ${{ inputs.duration }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          videos = list(Path("output").glob("**/video.mp4")) if Path("output").exists() else []
          if not videos:
              print("No output/video.mp4 was generated.")
              sys.exit(1)
          valid = []
          minimum_seconds = float(os.environ.get("VIDEO_DURATION", "10")) * 60 - 15
          for video in videos:
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries",
                   "format=duration:stream=codec_type,width,height",
                   "-of", "json", str(video)],
                  capture_output=True, text=True
              )
              try:
                  data = json.loads(probe.stdout)
                  duration = float(data.get("format", {}).get("duration", 0))
                  streams = data.get("streams", [])
              except (ValueError, TypeError, json.JSONDecodeError):
                  duration, streams = 0, []
              video_streams = [s for s in streams if s.get("codec_type") == "video"]
              audio_streams = [s for s in streams if s.get("codec_type") == "audio"]
              width = int(video_streams[0].get("width", 0)) if video_streams else 0
              height = int(video_streams[0].get("height", 0)) if video_streams else 0
              size = video.stat().st_size
              print(f"{video}: duration={duration/60:.2f} min, resolution={width}x{height}, audio={bool(audio_streams)}, size={size/1024/1024:.1f} MB")
              if (probe.returncode == 0 and duration >= minimum_seconds and
                  width >= 1920 and height >= 1080 and audio_streams and size > 100_000):
                  valid.append(video)
              else:
                  print("Rejected: expected requested duration, 1920x1080 or better, an audio stream, and a readable non-empty MP4.")
          if not valid:
              print("Video quality gate failed.")
              sys.exit(1)
          PY

      - name: Upload video and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educational-video
          path: |
            output/
            topics.csv
          if-no-files-found: warn
          retention-days: 7
