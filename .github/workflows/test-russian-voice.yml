name: Test Russian voice — Russian TTS Studio

on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "Текст для проверки голоса (короткий отрывок)"
        required: true
        type: string
        default: "Привет! Сегодня мы разберём удивительную историю, которая изменила наш мир. Вы узнаете неожиданные факты и поймёте, почему это произошло."
permissions:
  contents: read

jobs:
  voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSSIAN_TTS_STUDIO_URL: ${{ secrets.RUSSIAN_TTS_STUDIO_URL }}
      SAMPLE_TEXT: ${{ inputs.sample_text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and requests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip requests
      - name: Generate preview with VoxCPM2
        run: |
          python - <<'PY'
          import os, sys, requests
          from pathlib import Path
          base = os.environ.get("RUSSIAN_TTS_STUDIO_URL", "").strip().rstrip("/")
          text = os.environ.get("SAMPLE_TEXT", "").strip()
          if not base.startswith(("https://", "http://")):
              raise SystemExit("Missing RUSSIAN_TTS_STUDIO_URL secret. It must be the base URL of a running Russian TTS Studio server.")
          if not text:
              raise SystemExit("Please enter a short sample text.")
          if len(text) > 1800:
              raise SystemExit("For a quick preview, keep the sample under 1800 characters.")
          response = requests.post(
              base + "/api/synthesize",
              data={
                  "text": text,
                  "engine": "voxcpm",
                  "instruct": "Natural Russian educational narrator, warm adult voice, expressive but restrained intonation, clear pronunciation, natural pauses.",
                  "enable_fallback": "false",
                  "enable_postprocess": "true",
                  "enable_quality_check": "false",
                  "enable_prosody": "true",
                  "pause_ms_comma": "140",
                  "pause_ms_period": "300",
                  "pause_ms_question": "320",
                  "pause_ms_exclamation": "320",
              },
              timeout=900,
          )
          response.raise_for_status()
          data = response.json()
          audio_url = data.get("audio_url")
          if not audio_url:
              raise SystemExit("TTS Studio response has no audio_url: " + str(data)[:1000])
          if not audio_url.startswith(("https://", "http://")):
              audio_url = base + "/" + audio_url.lstrip("/")
          audio = requests.get(audio_url, timeout=180)
          audio.raise_for_status()
          wav = Path("voice-preview.wav")
          wav.write_bytes(audio.content)
          if wav.stat().st_size < 1000:
              raise SystemExit("Russian TTS Studio returned an empty audio file.")
          import subprocess
          result = subprocess.run(
              ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(wav),
               "-c:a", "libmp3lame", "-q:a", "2", "voice-preview.mp3"],
              capture_output=True, text=True
          )
          if result.returncode:
              raise SystemExit("MP3 conversion failed: " + result.stderr[-1000:])
          print("VoxCPM2 preview created:", Path("voice-preview.mp3").stat().st_size, "bytes")
          PY
      - name: Upload voice preview
        uses: actions/upload-artifact@v4
        with:
          name: russian-tts-studio-preview
          path: |
            voice-preview.mp3
            voice-preview.wav
          retention-days: 3
