name: Test Russian voice

on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "Текст для проверки голоса (короткий отрывок)"
        required: true
        type: string
        default: "Привет! Сегодня мы разберём удивительную историю, которая изменила наш мир. Вы узнаете неожиданные факты, поймёте, почему это произошло, и какие выводы можно сделать."
      voice:
        description: "Голос для проверки"
        required: true
        type: choice
        options:
          - marin
          - cedar
          - coral
          - nova
        default: marin

permissions:
  contents: read

jobs:
  voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice engine
        run: python -m pip install --upgrade pip requests
      - name: Generate short preview
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          SAMPLE_TEXT: \${{ inputs.sample_text }}
          VOICE: \${{ inputs.voice }}
        run: |
          python - <<'PY'
          import os, requests
          from pathlib import Path
          key = os.environ.get("OPENAI_API_KEY", "").strip()
          # Normalize accidental leading slash or wrapping quotes in the GitHub secret.
          if len(key) >= 2 and key[0] == key[-1] and key[0] in ("'", '"'):
              key = key[1:-1].strip()
          key = key.lstrip("\\").strip()
          text = os.environ.get("SAMPLE_TEXT", "").strip()
          voice = os.environ["VOICE"]
          if not key:
              raise SystemExit("Missing OPENAI_API_KEY secret. Add it in Settings > Secrets and variables > Actions.")
          if not text:
              raise SystemExit("Please enter a short sample text.")
          if len(text) > 1800:
              raise SystemExit("For a quick preview, keep the sample under 1800 characters.")
          payload = {
              "model": "gpt-4o-mini-tts",
              "voice": voice,
              "input": text,
              "instructions": "Speak in natural, fluent Russian like a professional educational YouTube narrator. Use clear pronunciation, warm confident delivery, natural intonation and moderate pacing. Avoid robotic monotony, exaggerated acting, and unnatural pauses.",
              "response_format": "mp3",
              "speed": 0.95,
          }
          response = requests.post("https://api.openai.com/v1/audio/speech", headers={"Authorization": "Bearer " + key}, json=payload, timeout=120)
          if response.status_code != 200:
              try:
                  detail = response.json().get("error", {}).get("message", response.text[:600])
              except Exception:
                  detail = response.text[:600]
              raise SystemExit("OpenAI speech API failed (HTTP %s): %s" % (response.status_code, detail))
          target = Path("voice-preview.mp3")
          target.write_bytes(response.content)
          if target.stat().st_size < 1000 or not (response.content.startswith(b"ID3") or response.content.startswith(bytes([255]))):
              raise SystemExit("Speech API returned an empty or invalid MP3.")
          print("Preview created: %s bytes, voice=%s" % (target.stat().st_size, voice))
          PY
      - name: Upload voice preview
        uses: actions/upload-artifact@v4
        with:
          name: russian-voice-preview
          path: voice-preview.mp3
          retention-days: 3
