name: Test Russian voice

on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "Текст для проверки голоса (короткий отрывок)"
        required: true
        type: string
        default: "Привет! Сегодня мы разберём удивительную историю, которая изменила наш мир. Вы узнаете неожиданные факты, поймёте, почему это произошло, и какие выводы можно сделать."
      voice:
        description: "Голос для проверки"
        required: true
        type: choice
        options:
          - ru-RU-SvetlanaNeural
          - ru-RU-DmitryNeural
        default: ru-RU-SvetlanaNeural

permissions:
  contents: read

jobs:
  voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice engine
        run: python -m pip install --upgrade pip edge-tts
      - name: Generate short preview
        env:
          SAMPLE_TEXT: ${{ inputs.sample_text }}
          VOICE: ${{ inputs.voice }}
        run: |
          python - <<'PY'
          import asyncio, os
          from pathlib import Path
          import edge_tts
          text = os.environ.get("SAMPLE_TEXT", "").strip()
          voice = os.environ["VOICE"]
          if not text:
              raise SystemExit("Please enter a short sample text.")
          if len(text) > 1800:
              raise SystemExit("For a quick preview, keep the sample under 1800 characters.")
          async def main():
              target = Path("voice-preview.mp3")
              await edge_tts.Communicate(text, voice, rate="-5%").save(str(target))
              if not target.exists() or target.stat().st_size < 1000:
                  raise SystemExit("Preview audio was not generated correctly.")
              print(f"Preview created: {target.stat().st_size} bytes, voice={voice}")
          asyncio.run(main())
          PY
      - name: Upload voice preview
        uses: actions/upload-artifact@v4
        with:
          name: russian-voice-preview
          path: voice-preview.mp3
          retention-days: 3
